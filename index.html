<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenant Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Sidebar Menu -->
    <div class="sidebar">
        <h2>Tenant Manager</h2>
        <ul>
            <li><a href="#" id="nav-dashboard">Dashboard</a></li>
            <li><a href="#" id="nav-add-tenant">Add Tenant</a></li>
            <li><a href="#" id="nav-tenant-list">Tenant List</a></li>
            <li><a href="#" id="nav-collect-rent">Collect Rent</a></li>
            <li><a href="#">Settings</a></li>
        </ul>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        
        <!-- 1. Dashboard Section -->
        <div id="dashboard-section" class="section active">
            <h1>Dashboard</h1>
            <div class="stats-container">
                <div class="stat-box">
                    <h3>Total Tenants</h3>
                    <p id="total-tenants">0</p>
                </div>
                <div class="stat-box">
                    <h3>Total Rent</h3>
                    <p>৳ <span id="total-rent">0</span></p>
                </div>
            </div>
        </div>

        <!-- 2. Add Tenant Section -->
        <div id="add-tenant-section" class="section hidden">
            <h1>Add New Tenant</h1>
            <form id="tenant-form">
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" required>
                </div>
                <div class="form-group">
                    <label for="nid">NID Number:</label>
                    <input type="text" id="nid" required>
                </div>
                <div class="form-group">
                    <label for="meter">Meter Number:</label>
                    <input type="text" id="meter" required>
                </div>
                <div class="form-group">
                    <label for="rent">Monthly Rent (৳):</label>
                    <input type="number" id="rent" required>
                </div>
                <button type="submit" class="btn-submit">Save Tenant Information</button>
            </form>
        </div>

        <!-- 3. Tenant List & Search Section -->
        <div id="tenant-list-section" class="section hidden">
            <h1>Tenant List</h1>
            <div class="search-container">
                <input type="text" id="search-bar" placeholder="Search by Name, Phone, or NID...">
            </div>
            
            <table class="tenant-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>NID</th>
                        <th>Rent (৳)</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tenant-table-body">
                    <!-- Javascript theke data ekhane asbe -->
                </tbody>
            </table>
        </div>

        <!-- 4. Collect Rent Section -->
        <div id="collect-rent-section" class="section hidden">
            <h1>Collect Monthly Rent</h1>
            <form id="rent-form">
                <div class="form-group">
                    <label for="select-tenant">Select Tenant:</label>
                    <select id="select-tenant" required>
                        <option value="">-- Choose a Tenant --</option>
                        <!-- Javascript theke ekhane nam asbe -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="rent-month">Rent Month & Year:</label>
                    <input type="month" id="rent-month" required>
                </div>
                <div class="form-group">
                    <label for="paid-amount">Paid Amount (৳):</label>
                    <input type="number" id="paid-amount" required>
                </div>
                <div class="form-group">
                    <label for="due-amount">Due Amount (৳) [If any]:</label>
                    <input type="number" id="due-amount" value="0">
                </div>
                <button type="submit" class="btn-submit">Save Rent Record</button>
            </form>
        </div>

    </div>
    <!-- Rent History Modal (Popup) -->
    <div id="history-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <h2>Rent History: <span id="modal-tenant-name"></span></h2>
            
            <table class="tenant-table">
                <thead>
                    <tr>
                        <th>Month</th>
                        <th>Paid (৳)</th>
                        <th>Due (৳)</th>
                        <th>Payment Date</th>
                    </tr>
                </thead>
                <tbody id="history-table-body">
                    <!-- Javascript theke history asbe -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Javascript File Connection (type="module" is very important for Firebase) -->
    <script type="module" src="app.js"></script>
</body>
</html>
