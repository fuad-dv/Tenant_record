<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bariwala - Tenant Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <h2>Bariwala Admin</h2>
        <ul>
            <li><a href="#" id="nav-dashboard">Dashboard</a></li>
            <li><a href="#" id="nav-add-tenant">Add Tenant</a></li>
            <li><a href="#">Tenant List</a></li>
            <li><a href="#">Settings</a></li>
        </ul>
    </div>

    <div class="main-content">
        <!-- Dashboard Section -->
        <div id="dashboard-section" class="section active">
            <h1>Dashboard</h1>
            <div class="stats-container">
                <div class="stat-box">
                    <h3>Total Tenants</h3>
                    <p id="total-tenants">0</p>
                </div>
                <div class="stat-box">
                    <h3>Total Rent Collected</h3>
                    <p>৳ <span id="total-rent">0</span></p>
                </div>
            </div>
        </div>

        <!-- Add Tenant Section -->
        <div id="add-tenant-section" class="section hidden">
            <h1>Add New Tenant</h1>
            <form id="tenant-form">
                <div class="form-group">
                    <label for="name">Tenant Name:</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" required>
                </div>
                <div class="form-group">
                    <label for="nid">NID Number:</label>
                    <input type="text" id="nid" required>
                </div>
                <div class="form-group">
                    <label for="rent">Monthly Rent (৳):</label>
                    <input type="number" id="rent" required>
                </div>
                <button type="submit" class="btn-submit">Save Tenant Information</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
