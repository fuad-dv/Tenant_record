<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenant Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <h2>Tenant System</h2>
        <ul>
            <li><a href="#" id="link-dashboard">Dashboard</a></li>
            <li><a href="#" id="link-add-tenant">Add Tenant</a></li>
            <li><a href="#" id="link-tenant-list">Tenant List</a></li>
            <li><a href="#" id="link-collect-rent">Collect Rent</a></li>
        </ul>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">

        <!-- 1. Dashboard Section -->
        <section id="sec-dashboard" class="active">
            <h2>Dashboard</h2>
            <div class="dashboard-cards">
                <div class="card">
                    <h3>Total Tenants</h3>
                    <p id="total-tenants">0</p>
                </div>
                <div class="card">
                    <h3>Expected Total Rent</h3>
                    <p>৳ <span id="total-rent">0</span></p>
                </div>
            </div>
        </section>

        <!-- 2. Add Tenant Section -->
        <section id="sec-add-tenant" class="hidden">
            <h2>Add New Tenant</h2>
            <form id="tenant-form">
                <div class="form-group">
                    <label>Tenant Name:</label>
                    <input type="text" id="tenant-name" required>
                </div>
                <div class="form-group">
                    <label>Phone Number:</label>
                    <input type="text" id="tenant-phone" required>
                </div>
                <div class="form-group">
                    <label>NID Number:</label>
                    <input type="text" id="tenant-nid">
                </div>
                <div class="form-group">
                    <label>Monthly Rent (৳):</label>
                    <input type="number" id="tenant-rent" required>
                </div>
                <div class="form-group">
                    <label>Meter Number:</label>
                    <input type="text" id="tenant-meter">
                </div>
                <button type="submit">Register Tenant</button>
            </form>
        </section>

        <!-- 3. Tenant List Section -->
        <section id="sec-tenant-list" class="hidden">
            <h2>Tenant List</h2>
            <table class="tenant-table">
                <thead>
                    <tr>
                        <th>Name & Meter</th>
                        <th>Phone</th>
                        <th>NID</th>
                        <th>Rent (৳)</th>
                        <th>Action</th> <!-- Etai sei notun column -->
                    </tr>
                </thead>
                <tbody id="tenant-table-body">
                    <!-- Javascript theke data asbe -->
                </tbody>
            </table>
        </section>

        <!-- 4. Collect Rent Section -->
        <section id="sec-collect-rent" class="hidden">
            <h2>Collect Rent</h2>
            <form id="rent-form">
                <div class="form-group">
                    <label>Select Tenant:</label>
                    <select id="select-tenant" required>
                        <option value="">-- Select Tenant --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Rent Month:</label>
                    <input type="month" id="rent-month" required>
                </div>
                <div class="form-group">
                    <label>Paid Amount (৳):</label>
                    <input type="number" id="paid-amount" required>
                </div>
                <div class="form-group">
                    <label>Due Amount (৳):</label>
                    <input type="number" id="due-amount" value="0" required>
                </div>
                <button type="submit">Save Rent Record</button>
            </form>
        </section>

    </div>

    <!-- 5. Rent History Modal (Popup) -->
    <div id="history-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <h2>Rent History: <span id="modal-tenant-name"></span></h2>
            
            <table class="tenant-table">
                <thead>
                    <tr>
                        <th>Month</th>
                        <th>Paid (৳)</th>
                        <th>Due (৳)</th>
                        <th>Payment Date</th>
                    </tr>
                </thead>
                <tbody id="history-table-body">
                    <!-- Javascript theke history asbe -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase ebang Custom JS link -->
    <script type="module" src="app.js"></script>

</body>
</html>
