<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111214">
    <title>Invoice verification · Shiraji Villa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #111214;
            --paper: #f5f2ea;
            --paper-line: rgba(40, 36, 28, .12);
            --ink: #1c1b18;
            --ink-2: #5b574e;
            --ink-muted: #8c877b;
            --paid: #2f7d55;
            --due: #b0473f;
            --font: 'Plus Jakarta Sans', system-ui, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
            --ease: cubic-bezier(.2, .7, .2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 32px;
            padding: 40px 16px;
            background: var(--bg);
            color: #ececee;
            -webkit-font-smoothing: antialiased;
        }

        .loader { display: flex; align-items: center; gap: 12px; color: #a5a7ad; font-size: 14px; }
        .loader::before { content: ""; width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(237,238,240,.14); border-top-color: #ececee; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* The paper slip */
        .receipt-card {
            position: relative;
            width: 100%; max-width: 380px;
            padding: 32px 28px 40px;
            background: var(--paper);
            color: var(--ink);
            border-radius: 4px 4px 0 0;
            box-shadow: 0 24px 48px -20px rgba(0,0,0,.7), 0 2px 4px rgba(0,0,0,.3);
            display: none;
            animation: rise .3s var(--ease) both;
        }
        /* torn bottom edge */
        .receipt-card::after {
            content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 8px;
            background: conic-gradient(from -45deg at 50% 100%, var(--paper) 90deg, transparent 0) 0 0 / 16px 8px repeat-x;
        }
        @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

        .slip-head { text-align: center; padding-bottom: 20px; border-bottom: 1px dashed var(--paper-line); }
        .slip-head h2 { font-size: 18px; font-weight: 600; line-height: 1.3; }
        .slip-head .kind { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }

        .stamp {
            display: inline-flex; align-items: center; gap: 8px;
            margin-top: 16px;
            padding: 4px 12px 4px 8px;
            border: 1.5px solid var(--paid);
            border-radius: 6px;
            color: var(--paid);
            font-size: 13px; font-weight: 600;
            transform: rotate(-2deg);
        }
        .stamp svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

        .details { padding: 8px 0; border-bottom: 1px dashed var(--paper-line); }
        .details p { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 8px 0; font-size: 13px; color: var(--ink-2); }
        .details strong { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
        #r-due { color: var(--due) !important; }

        .total { display: flex; justify-content: space-between; align-items: baseline; padding: 20px 0 0; font-size: 14px; color: var(--ink-2); }
        .total > span { font-family: var(--mono); font-size: 28px; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; padding-bottom: 4px; border-bottom: 3px double var(--ink); }

        .meter-card { margin-top: 24px; padding-top: 16px; border-top: 1px dashed var(--paper-line); }
        .meter-card h3 { font-size: 12px; font-weight: 500; color: var(--ink-muted); margin-bottom: 12px; }
        .meter-card img { width: 100%; border-radius: 4px; display: block; background: #fff; }

        .btn-download {
            height: 40px; padding: 0 20px;
            border: 1px solid rgba(237,238,240,.14); border-radius: 8px;
            background: transparent; color: #ececee;
            font: inherit; font-size: 14px; font-weight: 500;
            cursor: pointer;
            transition: background-color .12s var(--ease);
        }
        .btn-download:hover { background: #1d1f22; }
        .btn-download:active { transform: scale(.98); }
        .btn-download:focus-visible { outline: 2px solid #5fb98a; outline-offset: 2px; }
        .foot { font-size: 12px; color: #6f7279; }

        /* receipt.js shows #receipt-content; the print button follows it */
        #receipt-content[style*="none"] ~ .actions, #receipt-content:not([style]) ~ .actions { display: none; }

        @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }

        @media print {
            body { background: #fff !important; padding: 0; }
            .actions, .foot { display: none !important; }
            .receipt-card { box-shadow: none; background: #fff; }
            .receipt-card::after { display: none; }
        }
    </style>
</head>
<body>
    <div id="loading" class="loader">Checking invoice</div>

    <div id="receipt-content" class="receipt-card">
        <div class="slip-head">
            <h2>Shiraji Villa</h2>
            <p class="kind">Rent receipt</p>
            <div class="stamp"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>Payment verified</div>
        </div>
        <div class="details">
            <p>Invoice <strong id="r-inv"></strong></p>
            <p>Date <strong id="r-date"></strong></p>
            <p>Tenant <strong id="r-tenant" style="font-family: var(--font); font-weight: 600;"></strong></p>
            <p>Rent month <strong id="r-month"></strong></p>
            <p id="r-gas-line">Gas bill <strong id="r-gas"></strong></p>
            <p>Due <strong id="r-due"></strong></p>
        </div>
        <div class="total">Total paid<span>৳<span id="r-total"></span></span></div>
        <div id="meter-info-card" class="meter-card" style="display: none;">
            <h3>Prepaid meter codes</h3>
            <img src="meter-codes.png" alt="Prepaid meter codes">
        </div>
    </div>

    <div class="actions"><button class="btn-download" onclick="window.print()">Print or save as PDF</button></div>
    <p class="foot">Verified from the Shiraji Villa ledger</p>

    <script type="module" src="receipt.js"></script>
</body>
</html>
