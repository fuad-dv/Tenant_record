<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Verification - Shiraji Villa</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f3f4f6; display: flex; justify-content: center; padding: 20px; }
        .receipt-card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 400px; width: 100%; text-align: center; display: none; }
        .receipt-card h2 { color: #4f46e5; margin-bottom: 5px; font-weight: 700; }
        .badge { background: #10b981; color: white; padding: 6px 15px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; margin-bottom: 25px; }
        .details { text-align: left; margin-bottom: 20px; font-size: 15px; color: #374151; }
        .details p { margin: 10px 0; border-bottom: 1px dashed #e2e8f0; padding-bottom: 8px; }
        .details strong { float: right; color: #0f172a; }
        .total { font-size: 22px; font-weight: 700; color: #4f46e5; margin-top: 15px; border-top: 2px solid #e2e8f0; padding-top: 15px; }
        .btn-download { background: #4f46e5; color: white; border: none; padding: 14px 20px; width: 100%; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 25px; transition: 0.3s; }
        .btn-download:hover { background: #4338ca; transform: translateY(-2px); }
        .loader { margin-top: 50px; font-size: 18px; color: #64748b; font-weight: 500; }
        @media print { .btn-download { display: none; } body { background: white; } .receipt-card { box-shadow: none; } }
    </style>
</head>
<body>
    <div id="loading" class="loader">Verifying Invoice... Please wait.</div>
    <div id="receipt-content" class="receipt-card">
        <h2>SHIRAJI VILLA</h2>
        <div class="badge">✓ VERIFIED PAYMENT</div>
        <div class="details">
            <p>Invoice No: <strong id="r-inv"></strong></p>
            <p>Date: <strong id="r-date"></strong></p>
            <p>Tenant Name: <strong id="r-tenant"></strong></p>
            <p>Rent Month: <strong id="r-month"></strong></p>
            <p id="r-gas-line">Gas Bill: <strong id="r-gas"></strong></p>
            <p>Due Amount: <strong id="r-due" style="color: #ef4444;"></strong></p>
        </div>
        <div class="total">Total Paid: ৳ <span id="r-total"></span></div>
        <div id="meter-info-card" class="receipt-card" style="margin-top: 20px; display: none; padding: 15px;">
        <h3 style="color: #4f46e5; margin-bottom: 15px; font-size: 18px;">Prepaid Meter Codes</h3>
        <img src="meter-codes.png" alt="Meter Codes" style="width: 100%; border-radius: 10px;">
    </div>
        <button class="btn-download" onclick="window.print()">Print / Save PDF</button>
    </div>

    <script type="module" src="receipt.js"></script>
</body>
</html>
