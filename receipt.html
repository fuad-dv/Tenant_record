<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070b1a">
    <title>Invoice Verification - Shiraji Villa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --grad: linear-gradient(135deg, #8b5cf6 0%, #6366f1 45%, #22d3ee 100%);
            --text: #eef1fb; --text-2: #c3c9e0; --muted: #8d96b5;
            --border: rgba(255,255,255,.12);
            --ease: cubic-bezier(.22, 1, .36, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 32px 18px;
            color: var(--text);
            background: radial-gradient(900px 600px at 0% 0%, #1b1650, transparent 60%),
                        radial-gradient(900px 600px at 100% 100%, #062a3a, transparent 60%),
                        linear-gradient(160deg, #070b1a, #0d1330);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        .blob { position: fixed; border-radius: 50%; filter: blur(80px); opacity: .5; z-index: -1; }
        .b1 { width: 420px; height: 420px; background: #8b5cf6; top: -120px; left: -100px; animation: f1 22s ease-in-out infinite alternate; }
        .b2 { width: 380px; height: 380px; background: #22d3ee; bottom: -120px; right: -100px; animation: f2 26s ease-in-out infinite alternate; }
        @keyframes f1 { to { transform: translate(30vw, 30vh) scale(1.2); } }
        @keyframes f2 { to { transform: translate(-30vw, -30vh) scale(.9); } }

        .glass {
            position: relative;
            background: linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
            border: 1px solid var(--border);
            backdrop-filter: blur(22px) saturate(150%); -webkit-backdrop-filter: blur(22px) saturate(150%);
            box-shadow: 0 30px 70px -24px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.1);
        }

        .loader { display: flex; flex-direction: column; align-items: center; gap: 18px; color: var(--text-2); font-size: 16px; font-weight: 600; text-align: center; }
        .loader::before { content: ""; width: 46px; height: 46px; border-radius: 50%; border: 3px solid rgba(255,255,255,.12); border-top-color: #8b5cf6; border-right-color: #22d3ee; animation: spin .9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .receipt-card { width: 100%; max-width: 420px; padding: 34px 28px 28px; border-radius: 28px; text-align: center; display: none; animation: pop .7s var(--ease) both; }
        @keyframes pop { from { opacity: 0; transform: translateY(20px) scale(.96); } to { opacity: 1; transform: none; } }

        .verified { width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, #34d399, #22d3ee); box-shadow: 0 0 0 8px rgba(52,211,153,.12), 0 16px 34px -10px rgba(52,211,153,.8); animation: ring 2.6s ease-in-out infinite; }
        .verified svg { width: 34px; height: 34px; stroke: #fff; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .7s .4s var(--ease) forwards; }
        @keyframes draw { to { stroke-dashoffset: 0; } }
        @keyframes ring { 0%,100% { box-shadow: 0 0 0 8px rgba(52,211,153,.12), 0 16px 34px -10px rgba(52,211,153,.8); } 50% { box-shadow: 0 0 0 14px rgba(52,211,153,.05), 0 16px 34px -10px rgba(52,211,153,.8); } }

        .receipt-card h2 { font-size: 22px; font-weight: 800; letter-spacing: 1px; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 8px; }
        .badge { display: inline-block; padding: 6px 14px; margin-bottom: 24px; border-radius: 999px; font-size: 11.5px; font-weight: 800; letter-spacing: .8px; color: #6ee7b7; background: rgba(52,211,153,.14); border: 1px solid rgba(52,211,153,.35); }

        .details { text-align: left; font-size: 14px; color: var(--text-2); border-radius: 16px; padding: 6px 16px; background: rgba(8,12,30,.35); border: 1px solid rgba(255,255,255,.07); }
        .details p { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px dashed rgba(255,255,255,.1); }
        .details p:last-child { border-bottom: none; }
        .details strong { color: var(--text); font-weight: 700; text-align: right; }
        #r-due { color: #fda4af !important; }

        .total { margin-top: 18px; padding: 18px; border-radius: 16px; font-size: 15px; font-weight: 600; color: var(--text-2); background: linear-gradient(135deg, rgba(139,92,246,.25), rgba(34,211,238,.12)); border: 1px solid rgba(139,92,246,.35); }
        .total span { display: block; font-size: 30px; font-weight: 800; color: #fff; letter-spacing: -.5px; margin-top: 2px; }

        .meter-card { margin-top: 18px; padding: 16px; border-radius: 16px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); }
        .meter-card h3 { font-size: 14px; font-weight: 700; color: var(--text-2); margin-bottom: 12px; }
        .meter-card img { width: 100%; border-radius: 10px; display: block; background: #fff; }

        .btn-download { position: relative; overflow: hidden; width: 100%; margin-top: 22px; padding: 14px 20px; border: none; border-radius: 12px; font: inherit; font-size: 15px; font-weight: 700; color: #fff; cursor: pointer; background: var(--grad); box-shadow: 0 12px 28px -10px rgba(124,108,246,.85); transition: transform .25s var(--ease), box-shadow .25s; }
        .btn-download:hover { transform: translateY(-2px); box-shadow: 0 16px 34px -10px rgba(124,108,246,.95); }
        .foot { margin-top: 20px; font-size: 12px; color: var(--muted); }

        @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } .verified svg { stroke-dashoffset: 0; } }

        @media print {
            body { background: #fff !important; color: #000; padding: 0; }
            .blob, .btn-download, .foot { display: none !important; }
            .glass, .details, .total, .meter-card { background: #fff !important; box-shadow: none !important; backdrop-filter: none !important; border-color: #ddd !important; }
            .receipt-card h2, .total span, .details strong { color: #000 !important; -webkit-text-fill-color: #000; }
            .details, .total { color: #333; }
            .verified { box-shadow: none; animation: none; }
            .verified svg { stroke-dashoffset: 0; animation: none; }
        }
    </style>
</head>
<body>
    <span class="blob b1"></span><span class="blob b2"></span>

    <div id="loading" class="loader">Verifying Invoice... Please wait.</div>

    <div id="receipt-content" class="receipt-card glass">
        <div class="verified"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
        <h2>SHIRAJI VILLA</h2>
        <div class="badge">✓ VERIFIED PAYMENT</div>
        <div class="details">
            <p>Invoice No <strong id="r-inv"></strong></p>
            <p>Date <strong id="r-date"></strong></p>
            <p>Tenant Name <strong id="r-tenant"></strong></p>
            <p>Rent Month <strong id="r-month"></strong></p>
            <p id="r-gas-line">Gas Bill <strong id="r-gas"></strong></p>
            <p>Due Amount <strong id="r-due"></strong></p>
        </div>
        <div class="total">Total Paid<span>৳ <span id="r-total" style="display:inline; font-size:inherit; margin:0;"></span></span></div>
        <div id="meter-info-card" class="meter-card" style="display: none;">
            <h3>Prepaid Meter Codes</h3>
            <img src="meter-codes.png" alt="Meter Codes">
        </div>
        <button class="btn-download" onclick="window.print()">Print / Save PDF</button>
    </div>
    <p class="foot">Digitally verified receipt · Shiraji Villa</p>

    <script type="module" src="receipt.js"></script>
</body>
</html>
